services:
  rio_backend1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rio_backend1
    restart: always
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    networks:
      - rio_erp_network
    ports:
      - "7000:7000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rio_backend2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rio_backend2
    restart: always
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    networks:
      - rio_erp_network
    ports:
      - "7001:7001"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 7001
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rio_node:
    image: node:18
    container_name: rio_node
    restart: always
    working_dir: /app
    volumes:
      - ./node:/app
    command: ["node", "server.js"]
    depends_on:
      - rio_backend1
      - rio_backend2
    ports:
      - "8001:8001"
    networks:
      - rio_erp_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rio_frontend:
    build:
      context: ./frontend_rio
    container_name: rio_frontend
    volumes:
      - ./frontend_rio:/app
    networks:
      - rio_erp_network
    depends_on:
      - rio_node
    ports:
      - "3001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rio_backup:
    image: alpine
    container_name: rio_backup
    restart: always
    volumes:
      - ./backups:/backups
    networks:
      - rio_erp_network
    command: ["sleep", "infinity"]

networks:
  rio_erp_network:
    driver: bridge