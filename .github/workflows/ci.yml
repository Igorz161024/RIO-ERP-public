name: RIO-ERP CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-check:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 4568
          POSTGRES_DB: erp_diplom
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_USER: postgres
      DB_PASS: 4568
      DB_NAME: erp_diplom
      DB_HOST: localhost
      DB_PORT: 5432
      PYTHONPATH: ${{ github.workspace }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend requirements
        run: |
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

      - name: Install frontend requirements
        run: |
          if [ -f frontend_rio/requirements.txt ]; then
            pip install -r frontend_rio/requirements.txt
          fi

      - name: Install root requirements
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install test tools
        run: |
          pip install pytest pytest-asyncio pytest-cov  
      - name: Check backend syntax
        run: python -m compileall backend

      - name: Check frontend syntax
        run: python -m compileall frontend_rio

      - name: Check FastAPI import
        run: python -c "import fastapi"

      - name: Check SQLAlchemy import
        run: python -c "import sqlalchemy"

      - name: Check backend application import
        run: python -c "from backend.main import app"

      - name: Validate environment template
        run: |
          test -f .env.example

      - name: Validate docker compose
        run: |
          cp .env.example .env
          docker compose config

      - name: Create database tables
        run: python backend/init_db.py    

      - name: Run backend tests
        run: |
          pytest tests -v --cov=backend --cov-report=term

      - name: Build backend image
        run: docker build -t rio-backend ./backend

      - name: Build frontend image
        run: docker build -t rio-frontend ./frontend_rio

      - name: Verify project structure
        run: |
          test -f README.md
          test -f docker-compose.yml
          test -f backend/main.py
          test -f backend/database.py
          test -f backend/auth.py
          test -f frontend_rio/main.py

      - name: Summary
        run: |
          echo "RIO-ERP validation completed successfully"