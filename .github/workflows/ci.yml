name: RIO-ERP CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend requirements
        run: |
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

      - name: Install root requirements
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Check backend syntax
        run: python -m compileall backend

      - name: Check frontend syntax
        run: python -m compileall frontend_rio

      - name: Check FastAPI application import
        run: python -c "from backend.main import app"

      - name: Check FastAPI import
        run: python -c "import fastapi"

      - name: Check SQLAlchemy import
        run: python -c "import sqlalchemy"

      - name: Build backend image
        run: docker build -t rio-backend ./backend

      - name: Build frontend image
        run: docker build -t rio-frontend ./frontend_rio

      - name: Validate docker compose
        run: docker compose config